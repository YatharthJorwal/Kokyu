# Developer-only (FR-R-6): end users save their key in the app, which keeps it in
# the Windows Credential Manager. Copy to secrets.local.yaml (gitignored) and fill
# in. Never commit this file. Packaged builds ignore it.
#
# Resolution order for the active API endpoint's key (D-059):
#   1. the key saved in the app (handed over by the desktop shell)
#   2. the environment variable named by the endpoint's `api_key_env`
#   3. this file: only the section named after that endpoint
#   4. .env
# A provider with no resolvable key is marked unavailable and never guessed at.

airouter:
  api_key: 'sk-replace-me'
