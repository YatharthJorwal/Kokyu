# Kōkyū — config example
#
# Everything here is user-editable without touching Python. Every key has a code
# default; this file is the full surface, not a required minimum. Copy to
# config.yaml and edit.
#
# Secrets never live in this file. Keys come from the environment or from
# secrets.local.yaml (gitignored), named by `api_key_env`.
#
# What the app's Settings edits (the Ollama address, the budget, a custom API
# endpoint, screen companions at start) is saved in settings.json in the app
# data folder and wins over this file, key by key (D-070).
#
# WINDOWS PATHS: wrap any path containing backslashes in SINGLE quotes, e.g.
#   'C:\Users\you\file.wav'
# Double quotes treat \U \n \t as escapes and will fail to parse.

version: 2

# ─────────────────────────────────────────────────────────────────────────────
# Providers. The local one is the default for everything; airouter is only ever
# reached by the `mind` role (ROUTING.md §3).
# ─────────────────────────────────────────────────────────────────────────────
providers:
  local_ollama:
    enabled: true
    base_url: 'http://127.0.0.1:11434'
    # ollama_native is required for num_ctx, think:false, inline images and
    # `format` JSON schemas. Use `openai` only for a llama.cpp server.
    api_style: 'ollama_native'
    # Keeps the picked chat model (and the embedding model) loaded between turns
    # instead of paying a cold load. Any other model leaves after its call (D-072).
    keep_alive: '30m'
    # One value for every role: Ollama reloads the model when two requests
    # disagree on it.
    num_ctx: 8192
    request_timeout_s: 120

  airouter:
    # The one API endpoint (D-059); the name `airouter` is kept so role chains work.
    # End users save a key in the app (model menu > API key): it goes to the Windows
    # Credential Manager and picks the endpoint. Without one, `preset` and its
    # developer key (api_key_env, secrets.local.yaml, .env) apply. No key: API
    # models are unavailable and Mind stays local.
    # preset: airouter | openrouter | deepseek. A preset fixes its own base_url,
    # models_url, api_key_env, price_unit and models_cache (values written here are
    # ignored). For another endpoint, use your own id (a-z, 0-9, _) and set
    #   base_url: 'https://...'      (https, or plain http to this PC only)
    #   api_key_env: 'MY_API_KEY'
    #   price_unit: 'per_million'    # per_million | per_token | none (no prices: blocked while a cap is on)
    #   models_url, models_cache     (default: <base_url>/models, data/<id>_models.json)
    preset: 'airouter'
    enabled: true
    api_style: 'openai'     # /chat/completions, SSE, Bearer auth
    models_refresh_hours: 24
    prefer_zdr: true        # prefer zero-data-retention models for internal text
    request_timeout_s: 120

# ─────────────────────────────────────────────────────────────────────────────
# Models. Local names are exact Ollama tags. Cloud names come from the live
# catalog; the ones here are the P1 benchmark shortlist, not a commitment.
# ─────────────────────────────────────────────────────────────────────────────
#
# Mapping convention: when a role resolves to local_ollama it uses
# models.local.<role>; when it resolves to airouter it uses models.cloud.<role>.
# So `mind` has an entry in BOTH blocks: the cloud model, and the local model
# used when it falls back (ROUTING.md §4).
models:
  local:
    reflex: 'qwen3.5:9b'          # Q4_K_M, 6.55 GB, vision + tools
    vision: null                  # null = use reflex (it reports vision)
    # Helper roles. While an Ollama chat model is picked, the classifier, memory
    # writer and vision run on THAT model, so only it and the embedding model stay
    # in memory (D-072). These entries apply only while a llama.cpp or API model is
    # picked; then the model loads for its call and leaves. null = the reflex model.
    classifier: null              # intent, task, JSON
    memory_writer: null           # summarization; local by policy (CLAUDE.md invariant 3)
    embed: 'nomic-embed-text'     # 768-dim; sqlite-vec width is fixed to this
    mind: 'qwen3.5:9b'            # local fallback for the mind role
  cloud:
    mind: 'deepseek/deepseek-v4-flash'   # P1 bench decides; cheapest with 1M ctx + tools
    mind_fallback: 'alibaba/qwen-3-235b'

# ─────────────────────────────────────────────────────────────────────────────
# Roles. A role is a capability slot. `local_only: true` is enforced at config
# load: putting a cloud provider in one is a startup error, not a warning.
# ─────────────────────────────────────────────────────────────────────────────
roles:
  reflex:
    chain: [local_ollama]
    local_only: true
    max_tokens: 220
    temperature: 0.8
  vision:
    chain: [local_ollama]
    local_only: true
    max_tokens: 400
    temperature: 0.4
  classifier:
    chain: [local_ollama]
    local_only: true
    max_tokens: 300
    temperature: 0.1
  embed:
    chain: [local_ollama]
    local_only: true
  memory_writer:
    chain: [local_ollama]
    local_only: true      # local-only data: the most personal text never leaves
    max_tokens: 800
    temperature: 0.3
  mind:
    chain: [airouter, local_ollama]
    local_only: false
    max_tokens: 2000
    reasoning_tokens: 6000  # API only: extra cap when the model may think (billed as output)
    temperature: 0.6
  chat:                   # K1 (D-025): runs on the thread's chosen model; no fallback
    chain: [airouter, local_ollama]
    local_only: false
    max_tokens: 1200        # an API reply's cap, and what its cost estimate assumes (D-058)
    reasoning_tokens: 6000  # API only: extra cap when the model may think (billed as output)
    temperature: 0.7

# ─────────────────────────────────────────────────────────────────────────────
# Routing. Decision order and reason codes are ROUTING.md §4. First match wins.
# ─────────────────────────────────────────────────────────────────────────────
routing:
  mode: 'shadow'              # shadow | enforce (D-014)
  enforce_roles: [mind]       # which roles actually execute the decision

  escalate_when:
    task_steps_gte: 4
    tool_calls_gte: 2
    prompt_tokens_gte: 6000
    explicit_think_hard: true     # "think hard", "take your time", hotkey
    background_job: true

  # Roles that can never escalate, whatever the thresholds say. Belt and braces
  # with roles.*.local_only.
  never_escalate: [reflex, vision, classifier, embed, memory_writer]

  # Injected or screen-sourced content in the turn forces local Mind (D-012).
  untrusted_context_blocks_cloud: true

# ─────────────────────────────────────────────────────────────────────────────
# Privacy. Classes are per message; the call takes the maximum (ROUTING.md §5).
# ─────────────────────────────────────────────────────────────────────────────
privacy:
  cloud_allowed_classes: [public, internal]
  local_only_classes: [secret]
  redaction:
    secrets: true
    file_paths: true
    emails: true
    long_digit_runs: true
    memory_excerpt_max_chars: 600
    transcript_max_chars: 1200

# ─────────────────────────────────────────────────────────────────────────────
# Budget. Prices come from the provider catalog; caps are checked before a call.
# ─────────────────────────────────────────────────────────────────────────────
budget:
  enabled: true
  hourly_usd: 0.25
  daily_usd: 1.50
  monthly_usd: 20.00
  on_exhausted: 'local_only'
  prices: 'from_provider'
  # SQLite ledger so caps survive a restart. A cap of 0 means "never spend".
  ledger_path: 'data/spend.db'

# ─────────────────────────────────────────────────────────────────────────────
# Audit. One JSONL row per model call, counts only, never content by default.
# ─────────────────────────────────────────────────────────────────────────────
audit:
  path: 'logs/audit.jsonl'
  log_prompts: false
  log_responses: false
  log_redaction_counts: true

# ─────────────────────────────────────────────────────────────────────────────
# LLM defaults shared by every local call.
# ─────────────────────────────────────────────────────────────────────────────
llm:
  temperature: 0.8
  max_tokens: 512
  reasoning_tokens: 4096      # added to max_tokens while a model thinks: thinking counts against the cap (D-064)
  think: false                # hybrid-thinking models: keep reasoning off
  # One value for every call: Ollama reloads the model when two requests
  # disagree on it. Raise to 16384 only if nvidia-smi shows headroom.
  num_ctx: 8192
  # null = same model as reflex (it reports vision). Set a separate tag only
  # if the reflex model is a text-only build.
  vision_model: null
  top_p: 0.95
  top_k: 20
  presence_penalty: 1.5
  warm_up_on_start: true

# ─────────────────────────────────────────────────────────────────────────────
# Voice. Entirely local (D-006). Details in PHASE-2-FAST-PATH.md.
# ─────────────────────────────────────────────────────────────────────────────
voice:
  enabled: true

  stt:
    engine: 'faster_whisper'
    model_size: 'small'
    device: 'cpu'
    compute_type: 'int8'
    language: 'en'
    timeout_s: 20

  vad:
    engine: 'silero_onnx'       # fallback chain: webrtcvad, then energy gate
    speech_threshold: 0.5
    end_silence_ms: 500
    min_utterance_ms: 250
    max_utterance_ms: 30000
    pre_roll_ms: 200

  barge_in:
    enabled: true
    min_speech_ms: 300
    stop_within_ms: 150
    aec: 'browser'              # echoCancellation in getUserMedia
    fallback: 'half_duplex'     # applied if the P2 gate fails (D-016)

  push_to_talk_key: 'F9'

  mic:
    save_audio: false
    indicator: 'tray'

# ─────────────────────────────────────────────────────────────────────────────
# TTS. GPT-SoVITS is installed separately (docs/TTS-BACKEND.md); the kernel starts it
# when voice mode is turned on (D-061). One request per clause (D-009).
# ─────────────────────────────────────────────────────────────────────────────
tts:
  engine: 'gpt_sovits'
  stream: 'per_clause'
  fallback_engine: 'none'     # 'pyttsx3' opts in to the robotic placeholder voice
  # Voice starts only when voice mode is turned on, never at launch (D-061). Turned
  # off, the voice server stops after this many idle seconds.
  idle_stop_s: 300

  gpt_sovits:
    api_url: 'http://127.0.0.1:9880/tts'

    # The kernel starts the server after the window is up and the chat model has
    # loaded (D-060). Put your install folder in config/config.yaml (gitignored),
    # single-quoted, and set enabled: true:
    #   dir: 'D:\AI\GPT SoVITS\GPT-SoVITS-v3lora-20250228'
    launch:
      enabled: false
      dir: ''
      args:
        - '-a'
        - '127.0.0.1'
        - '-p'
        - '9880'
        - '-c'
        - 'GPT_SoVITS/configs/tts_infer.yaml'
      startup_timeout_s: 120
      restart_max: 2

    # Reference clips are per waifu now (waifu.yaml -> voice). These three keys are only
    # the legacy single-voice fallback used when no waifu is active; leave them empty.
    ref_audio_path: ''
    prompt_text: ''
    prompt_lang: 'en'
    text_lang: 'en'

    media_type: 'wav'
    prefetch_depth: 2
    first_clause_buffer_ms: 800

# ─────────────────────────────────────────────────────────────────────────────
# Speech-safe text. Applied to every spoken string, before TTS (D-008).
# ─────────────────────────────────────────────────────────────────────────────
speech:
  enabled: true
  max_segment_chars: 160
  min_segment_chars: 12
  code_blocks: 'say_marker'     # say_marker | skip
  acronym_allowlist: ['AI', 'API', 'CPU', 'CSS', 'DLL', 'FPS', 'GPU', 'HTML', 'HTTP', 'HTTPS', 'IP', 'JS', 'JSON', 'LLM', 'ML', 'NLP', 'OCR', 'OS', 'PC', 'RAM', 'SQL', 'SSD', 'STT', 'TV', 'TTS', 'URL', 'USB', 'VAD', 'VPN', 'VRAM', 'VRM', 'VRMA', 'YAML']

# ─────────────────────────────────────────────────────────────────────────────
# Latency instrumentation. One JSONL row per spoken turn (PHASE-2 §5).
# ─────────────────────────────────────────────────────────────────────────────
latency:
  log: 'logs/latency.jsonl'
  report_after_turns: 20
  targets_ms:
    stt: 700
    ttft: 400
    clause: 200
    tts: 900
    playback: 50
    total_p50: 1200
    total_p95: 1800
    inter_clause_gap: 300

# ─────────────────────────────────────────────────────────────────────────────
# Memory. SQLite + sqlite-vec, one file, 768-dim.
# ─────────────────────────────────────────────────────────────────────────────
memory:
  db_path: 'data/memory.db'
  recall_top_k: 5
  # The writer pass distills new transcript turns into facts + one episode summary.
  # It runs on a timer and at session end, never while a companion is speaking.
  # max_tokens caps its reply; window_tokens caps how much transcript one pass reads.
  writer:
    on_session_end: true
    interval_s: 600
    max_tokens: 800
    window_tokens: 2500
    busy_retry_s: 30
  # Recall is budgeted per consumer: the contents injected (profile card + facts +
  # episodes) never exceed `tokens`. Facts below the similarity floor are not injected.
  recall:
    reflex: {tokens: 300, facts: 3, episodes: 2}
    mind: {tokens: 1200, facts: 8, episodes: 5}
    fact_similarity_floor: 0.45
    episode_similarity_floor: 0.30
  # How a new fact is compared with stored ones. The model is only asked when a
  # neighbour is at least this similar and the deterministic checks were silent.
  contradiction:
    candidates: 5
    model_similarity_floor: 0.55
  # Nothing is deleted by decay: episodes fall out of search, facts lose confidence.
  decay:
    enabled: true
    half_life_days: 30        # episode salience
    fact_half_life_days: 180  # fact confidence (floor 0.1, pinned never decays)
    compress_below: 0.15
    compress_batch: 10
    drop_below: 0.05
    drop_after_days: 90
  profile_card:
    max_chars: 800

# ─────────────────────────────────────────────────────────────────────────────
# Task Guide: while a task is tracked, glance at the screen on this interval
# and steer back if the user drifts. 
# ─────────────────────────────────────────────────────────────────────────────
task_guide:
  capture_interval_seconds: 90
  idle_timeout_seconds: 1800
  # The classifier owns task start/stop; the model calling the tool itself
  # once started a phantom task from a bare "hi" (seen in real logs). Leave false.
  model_can_start_tasks: false
  # FR-SC-1: turn it on when Kokyu starts (Settings -> Screen sets this in
  # settings.json). Off by default; it still needs a local vision model.
  on_at_start: false

# ─────────────────────────────────────────────────────────────────────────────
# Continuous OCR: ambient remarks about the screen. Rare by design, and code
# enforces a floor between two spoken remarks regardless of what the model wants.
# ─────────────────────────────────────────────────────────────────────────────
ocr_watch:
  comment_interval_seconds: 240
  min_comment_gap_seconds: 120
  same_screen_similarity: 0.6
  pause_during_task: true
  on_at_start: false   # as task_guide.on_at_start

# ─────────────────────────────────────────────────────────────────────────────
# Screenshot sizing. Image cost grows with pixel count; full 1080p was the
# reason background glances were slow.
# ─────────────────────────────────────────────────────────────────────────────
vision:
  ambient_max_long_edge: 1024
  look_max_long_edge: 1600
  jpeg_quality: 85

session:
  max_history_turns: 20
  max_unprompted_in_history: 3

# ─────────────────────────────────────────────────────────────────────────────
# Story memory (FR-MODE-5): each roleplay thread keeps a running summary of its
# older scenes, written by the local memory_writer role when nothing else is
# using the model, and fed into every turn of that thread. Temp Chat keeps none.
# ─────────────────────────────────────────────────────────────────────────────
story:
  summarize_every: 12       # fold once this many older messages are waiting (0 = off)
  keep_recent: 4            # the newest messages are never folded (at least 2)
  max_chars: 2400           # the summary's cap, cut at a sentence end

# ─────────────────────────────────────────────────────────────────────────────
# Conversation model (K1, D-051). Threads with no model chosen use this.
# null = the Ollama model in `llm.model`. Examples:
#   local:ollama/qwen3.5:9b
#   local:llamacpp/qwen3.6-35b-a3b      (a preset id from `llamacpp.presets`)
#   api:airouter/<catalog id>
# ─────────────────────────────────────────────────────────────────────────────
chat:
  default_model_ref: null
  default_effort: null      # off | low | medium | high | max (a level the model lacks: its default)
  load_delay_s: 1.5         # opening a thread with another model loads it after this pause

# ─────────────────────────────────────────────────────────────────────────────
# VRAM manager (K1-09). Reads the GPU through the NVIDIA driver, remembers what
# each model really took (data/vram_measured.json) and estimates the rest, for
# the picker's fits hint and a check before a load. Never refuses on a guess.
# ─────────────────────────────────────────────────────────────────────────────
vram:
  headroom_mb: 512          # kept free for the desktop and the renderer
  kv_mb_per_1k_ctx: 128     # estimate only, until the model has been measured
  margin_mb: 512

# ─────────────────────────────────────────────────────────────────────────────
# llama.cpp (K1-01, D-051): large MoE models with expert weights in system RAM.
# The kernel starts llama-server when such a model is chosen and stops it when
# an Ollama model is chosen (one large model in VRAM at a time).
# server_path: '' = the llama-server bundled with Ollama, if installed.
# Put real model paths in config/config.yaml (gitignored), single-quoted.
# ─────────────────────────────────────────────────────────────────────────────
llamacpp:
  server_path: ''
  host: 127.0.0.1
  port: 8080
  startup_timeout_s: 600
  presets: []
  #  - id: qwen3.6-35b-a3b
  #    label: Qwen3.6 35B-A3B (Q4, experts on CPU)
  #    model_path: 'D:\models\Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf'
  #    n_cpu_moe: 40          # every expert on the CPU: ~3 GB VRAM (K1-01, docs/STATE.md)
  #    ctx: 8192
  #    threads: 10         # physical cores; measured fastest on an i5-14400F
