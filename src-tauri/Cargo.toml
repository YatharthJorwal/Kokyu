[package]
name = "kokyu"
version = "0.1.0"
description = "Kokyu - a chat app for AI companions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kokyu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Kept on the same minor as @tauri-apps/api in package.json; tauri dev flags a mismatch.
tauri = { version = "~2.12", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows Job Object: child processes end with the app (lib.rs, install_kill_on_close_job).
[target.'cfg(windows)'.dependencies]
win32job = "2"
# K1-08b (FR-R-6, D-059): API keys in the Windows Credential Manager. Already in
# Cargo.lock through Tauri, so no new download.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.dev]
# Full debug info is what makes src-tauri/target balloon to several GB (and slows the
# link step). Line tables keep readable backtraces at a fraction of the size.
debug = "line-tables-only"

[profile.release]
# Small footprint matters here -- this runs alongside a game.
lto = true
codegen-units = 1
panic = "abort"
strip = true
